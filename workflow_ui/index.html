<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoLogs | Command Center</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="nav-item active"><i data-lucide="layout-dashboard"></i></div>
            <div class="nav-item"><i data-lucide="folder"></i></div>
            <div class="nav-item"><i data-lucide="settings"></i></div>
            <div style="margin-top: auto;" class="nav-item"><i data-lucide="log-out"></i></div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <div>
                    <p class="text-secondary" style="font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em;">Project Pipeline</p>
                    <h1>GeoLogs Command Center</h1>
                </div>
                <div class="status-badge" id="global-status">
                    <span class="pulse"></span> System Ready
                </div>
            </header>

            <!-- Agent Swarm Grid -->
            <div class="swarm-container" id="agent-grid">
                <!-- 10 Agents will be injected here -->
            </div>

            <!-- Terminal Feed -->
            <div class="terminal" id="terminal-feed">
                <div class="log-entry">
                    <span class="log-time">[21:42:25]</span>
                    <span class="log-agent">SYSTEM</span>
                    <span class="log-msg">Initializing Agent Swarm v2.1...</span>
                </div>
            </div>
        </main>

        <!-- Right Details Panel -->
        <aside class="details-panel">
            <div class="card">
                <h3 style="margin-bottom: 1rem;">Interval Controls</h3>
                <div style="display: flex; flex-direction: column; gap: 1rem;">
                    <div>
                        <label class="text-secondary" style="font-size: 0.75rem;">Borehole ID</label>
                        <input type="text" id="bh-id" value="BH-101" style="width: 100%; background: var(--bg-dark); border: 1px solid var(--border-color); color: white; padding: 0.5rem; border-radius: 8px;">
                    </div>
                    <div>
                        <label class="text-secondary" style="font-size: 0.75rem;">Depth (m)</label>
                        <div style="display: flex; gap: 0.5rem;">
                            <input type="number" id="depth-from" value="0.0" step="0.1" style="width: 50%; background: var(--bg-dark); border: 1px solid var(--border-color); color: white; padding: 0.5rem; border-radius: 8px;">
                            <input type="number" id="depth-to" value="1.5" step="0.1" style="width: 50%; background: var(--bg-dark); border: 1px solid var(--border-color); color: white; padding: 0.5rem; border-radius: 8px;">
                        </div>
                    </div>
                    <button class="btn btn-primary" id="start-btn">Launch Pipeline</button>
                </div>
            </div>

            <div class="card" id="analysis-preview">
                <h3 style="margin-bottom: 0.5rem;">Live Analysis</h3>
                <p class="text-secondary" style="font-size: 0.875rem;">Real-time geological insights</p>
                <div class="analysis-image" id="photo-preview">
                    No Photo Loaded
                </div>
                <div style="margin-top: 1.5rem; display: flex; flex-direction: column; gap: 0.75rem;">
                    <div style="display: flex; justify-content: space-between;">
                        <span class="text-secondary">USCS Code</span>
                        <span id="uscs-display" style="font-weight: 700; color: var(--accent-blue);">--</span>
                    </div>
                    <div style="display: flex; justify-content: space-between;">
                        <span class="text-secondary">Consistency</span>
                        <span id="const-display">--</span>
                    </div>
                    <div style="display: flex; justify-content: space-between;">
                        <span class="text-secondary">QA Score</span>
                        <span id="qa-display">--</span>
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <script src="app.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
